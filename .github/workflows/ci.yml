name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Smoke test built output (CJS + ESM)
        run: |
          node -e "const l = require('./dist/index.js'); if (typeof l.default !== 'function') process.exit(1)"
          node --input-type=module -e "import l from './dist/index.mjs'; if (typeof l !== 'function') process.exit(1)"
